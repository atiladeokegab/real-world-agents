[project]
name = "agent"
version = "0.1.0"
description = "Banking track agent: real-world case handling with verified, bounded tool use."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "elevenlabs>=2.71.0",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
agent = "agent.core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
