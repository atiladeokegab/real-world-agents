<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Ops Agent — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #0A0A0B;
  --surface: #111113;
  --raise: #17171A;
  --line: #232327;
  --line-soft: #1A1A1D;
  --text: #EDEDEF;
  --text-2: #A1A1A8;
  --text-3: #6B6B73;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; }
code { font: 12.5px var(--mono); background: var(--raise); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; }

/* app bar */
.bar { border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; height: 52px; padding-bottom: 0; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--text); color: var(--bg); display: grid; place-items: center; font: 600 10px var(--mono); }
.bar b { font-weight: 600; }
.crumb { color: var(--text-3); }
.crumb a { color: var(--text-2); text-decoration: none; }
.crumb a:hover { color: var(--text); }
.sample { margin-left: auto; font: 12px var(--mono); color: var(--text-3); }

/* status tag (Stripe) */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 5px; font: 500 12px/1.6 var(--sans); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; vertical-align: middle; }
.tag b { font: 500 11px var(--mono); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
.btn:hover { border-color: #34343a; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }

/* overview (Mercury) */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 30px 0 22px; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font: 600 24px/1.2 var(--sans); letter-spacing: -0.015em; }
.page-head p { color: var(--text-3); margin-top: 4px; font-size: 13px; }
.stats { display: flex; gap: 36px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.stat .l { font-size: 12.5px; color: var(--text-3); }
.stat .v { font: 500 22px/1.3 var(--sans); letter-spacing: -0.01em; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 16px 0 10px; }
.filter { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--text-2); cursor: pointer; font-size: 13px; }
.filter:hover { color: var(--text); }
.filter[aria-pressed="true"] { color: var(--text); background: var(--raise); border-color: #34343a; }
.filter .count { font: 12px var(--mono); color: var(--text-3); }
.row { display: grid; grid-template-columns: 52px minmax(0, 2.6fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.4fr) 70px; gap: 14px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line-soft); }
.row.head { font-size: 12.5px; color: var(--text-3); padding-top: 8px; padding-bottom: 8px; border-bottom-color: var(--line); }
.row.case { cursor: pointer; }
.row.case:hover { background: var(--surface); }
.row .n { font: 13px var(--mono); color: var(--text-3); }
.row .t { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .t span:first-child { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font: 12.5px var(--mono); color: var(--text-3); text-align: right; }
.empty-row { padding: 28px 4px; color: var(--text-3); }

/* detail (Stripe) */
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 28px 0 26px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.eyebrow { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.d-head h1 { font: 600 26px/1.25 var(--sans); letter-spacing: -0.02em; margin: 6px 0 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.d-head .decision { color: var(--text-2); max-width: 680px; }
.actions { display: flex; gap: 8px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; align-items: start; padding-top: 26px; }
.sec { margin-bottom: 34px; }
.sec > h2 { font: 600 15px var(--sans); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; }
.sec > h2 span { font: 12.5px var(--mono); color: var(--text-3); font-weight: 400; }

/* timeline */
.tl { list-style: none; padding: 0; }
.tl > li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding-bottom: 18px; position: relative; }
.tl > li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 2px; width: 1px; background: var(--line); }
.tl > li:last-child::before { display: none; }
.tl .ic { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; font: 11px var(--mono); color: var(--c, var(--text-3)); background: var(--raise); border: 1px solid var(--line); }
.tl .what { font-weight: 500; }
.tl .when { font-size: 12.5px; color: var(--text-3); }
.tl .quote { margin-top: 6px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 14px; }
.pinned { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 7%, var(--surface)); border-radius: 10px; padding: 14px 16px; }
.pinned .label { font: 500 12px var(--sans); color: var(--c); display: flex; justify-content: space-between; gap: 10px; }
.pinned .q { font-size: 15px; font-weight: 500; margin: 6px 0 12px; }
.pinned dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px; font-size: 13.5px; }
.pinned dt { color: var(--text-3); }
.pinned .actions { margin-top: 14px; }

/* steps (Vercel) */
.steps { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.steps details { border-top: 1px solid var(--line); }
.steps details:first-child { border-top: 0; }
.steps summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 14px 92px minmax(0, 1fr) 18px; gap: 10px; align-items: center; padding: 10px 14px; }
.steps summary::-webkit-details-marker { display: none; }
.steps summary:hover { background: var(--surface); }
.steps summary .chev { color: var(--text-3); font-size: 11px; transition: transform 0.15s; }
.steps details[open] summary .chev { transform: rotate(90deg); }
.steps summary .name { font: 13px var(--mono); color: var(--text-2); }
.steps summary .val { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps summary .st { font: 12px var(--mono); color: var(--s); text-align: right; }
.log { background: #070708; border-top: 1px solid var(--line); font: 12.5px/1.75 var(--mono); padding: 8px 0; color: #C9C9CE; }
.log .l { display: block; padding: 0 14px; white-space: pre-wrap; word-break: break-word; }
.log .l .lab { color: var(--text-3); display: inline-block; width: 10ch; }
.log .l.is-warn { background: rgba(224, 163, 59, 0.10); }
.log .l.is-bad { background: rgba(240, 106, 85, 0.12); }
.log .l.is-fail { background: rgba(208, 107, 176, 0.12); }
.log .ok { color: #3FB984; } .log .warn { color: #E0A33B; } .log .bad { color: #F06A55; } .log .fail { color: #D06BB0; } .log .dim { color: #5B5B63; }
.log .out { display: block; padding: 8px 14px 2px; margin-top: 6px; border-top: 1px dashed var(--line); color: var(--text); }

ul.plain { list-style: none; padding: 0; }
ul.plain li { padding: 9px 0; border-top: 1px solid var(--line-soft); }
ul.plain li:first-child { border-top: 0; padding-top: 0; }

/* files */
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { all: unset; cursor: pointer; padding: 8px 0; margin-bottom: -1px; font: 13px var(--mono); color: var(--text-3); border-bottom: 1px solid transparent; }
.tabs button[aria-pressed="true"] { color: var(--text); border-color: var(--text); }
.doc h3 { font: 500 11.5px var(--mono); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin: 20px 0 6px; }
.doc h3:first-child { margin-top: 0; }
.doc ul { padding-left: 18px; color: var(--text-2); }
.doc p { color: var(--text-2); }
.doc li { margin: 3px 0; }
.doc b { color: var(--text); font-weight: 500; }
.doc .quote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--text); }
.doc .meta { font-size: 12px; color: var(--text-3); }

/* side (Stripe details, no boxes) */
.side h3 { font: 600 13px var(--sans); padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.side section { margin-bottom: 30px; }
.side dt { font-size: 12.5px; color: var(--text-3); }
.side dd { margin: 1px 0 12px; }
.side ul.plain li { font-size: 13.5px; color: var(--text-2); }
.side p { color: var(--text-2); font-size: 13.5px; }

[hidden] { display: none !important; }
@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; gap: 8px; }
  .row { grid-template-columns: 36px minmax(0, 1fr) 64px; }
  .row > :nth-child(3), .row > :nth-child(4), .row > :nth-child(5) { display: none; }
  .stats { gap: 22px; flex-wrap: wrap; }
}
@media (max-width: 520px) {
  .wrap { padding: 0 16px 56px; }
  .pinned dl { grid-template-columns: 1fr; gap: 0 0; }
  .pinned dd { margin-bottom: 8px; }
  .steps summary { grid-template-columns: 14px 1fr 18px; }
  .steps summary .val { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="logo">H&amp;V</div>
    <b>Ops Agent</b>
    <span class="crumb" id="crumb"></span>
    <span class="sample">mockup · sample data, not real results</span>
  </div>
</header>

<main class="wrap">
  <section id="overview">
    <div class="page-head">
      <div>
        <h1>Cases</h1>
        <p>Reality Test run · finished in 2m 28s</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="filters" id="filters"></div>
    <div id="table"></div>
  </section>

  <section id="detail" hidden></section>
</main>

<script>
const C = { done: "#3FB984", requested: "#E0A33B", info: "#6B8CFF", escalated: "#F06A55", noop: "#8E929A", failure: "#D06BB0" };

const RECEIVED = "<p><code>index.md</code>, <code>history.md</code> · 0 attachments · 5 events · cut at <code>event-002</code> · identity: authenticated business user (secure chat)</p>";

const CASES = [
  {
    id: "done", label: "DONE", glyph: "●", color: C.done,

    term: [

      ["identity", "authenticated business user <span class='dim'>· secure chat</span>"],
      ["evidence", "<span class='warn'>1 finding</span> · batch “Processed” doesn't prove row SUP-17 was paid"],
      ["extract", "1 ask · 1 unknown <span class='dim'>(row SUP-17 status)</span>"],
      ["decide", "tool_call payment_journal.row_status <span class='dim'>(batch=Alderwick supplier payments, row=SUP-17)</span>"],
      ["verify", "<span class='ok'>✓</span> read · autonomous"],
      ["execute", "payment_journal → SUP-17 <span class='bad'>REJECTED</span> <span class='dim'>· beneficiary details mismatch</span>"],
      ["decide", "reply · secure chat"],
      ["verify", "<span class='ok'>✓</span> claim-linter · <span class='ok'>✓</span> ask-1 closed · <span class='ok'>✓</span> finding-1 addressed"],
      ["write", "ANSWERS/1/ <span class='dim'>ANSWER.md REASONING.md trace.log run.json</span>"],
    ],
    out: "● DONE  1 action · 0 escalations · 6.4s",
    answer: [
      ["Decision", "<p><span class='pill' style='--pc:#1F9D6B'>DONE</span> Checked row SUP-17 in the payment journal; it is shown as rejected.</p>"],
      ["What we received", RECEIVED],
      ["Actions", "<ul><li><code>payment_journal.row_status(SUP-17)</code> — <b>done</b> → Rejected: beneficiary details did not match the receiving institution's records.</li></ul>"],
      ["Customer reply", "<p class='meta'>Secure chat</p><p class='quote'>We've checked row SUP-17 in your supplier batch. It was rejected because the beneficiary details didn't match the receiving bank's records. The other rows haven't been rechecked.</p>"],
      ["Not done", "<ul><li>Rechecked the other rows — because only SUP-17 was asked about.</li><li>Resubmitted SUP-17 — because that needs the batch's authorised signatories.</li></ul>"],
      ["Evidence used", "<ul><li><code>event-001</code> batch status: Processed</li><li><code>event-002</code> the request for row SUP-17</li><li><code>tool:payment_journal</code> SUP-17: Rejected, beneficiary mismatch</li></ul>"],
      ["What failed", "<p>Nothing.</p>"],
    ],
    reasoning: [
      ["Facts and claims", "<ul><li>Fact: batch “Alderwick supplier payments” shows Processed (<code>event-001</code>, portal).</li><li>Claim: Leona Voss is authorised to view payouts (<code>event-002</code>); her business-portal role confirms it.</li></ul>"],
      ["Findings", "<ul><li><b>finding-1 · status</b> — batch-level status says nothing about one row. Addressed by reading the row, not inferring it.</li></ul>"],
      ["Policy checks", "<ul><li>Identity: authenticated (secure chat) ✓</li><li>Authority: view payouts ✓</li><li>Risk level: read — autonomous</li><li>Completion: ask-1 closed ✓</li><li>Disclosure: no account details in the reply ✓</li></ul>"],
      ["Exception and handling", "<p>None.</p>"],
      ["Alternatives rejected", "<ul><li>“The batch is processed, so the row was paid” — a batch status doesn't establish a line's status.</li><li>Escalate to Business Payments — a single read answers it.</li></ul>"],
      ["Uncertainties", "<ul><li>Whether the supplier has been told. Out of scope.</li></ul>"],
    ],
    handover: null,
  },
  {
    id: "requested", label: "REQUESTED", glyph: "◐", color: C.requested,
    title: "One line in the supplier batch — unseen case, no live journal",
    headline: "Asked the payment journal about SUP-17. <em>Waiting</em> on the result.",
    stages: [["ok","5 events"],["ok","authenticated"],["warn","1 finding"],["ok","1 ask"],["ok","read"],["ok","approved"],["warn","pending"],["ok","4 files"]],
    term: [
      ["ingest", "5 events · 0 attachments · cut at event-002"],
      ["identity", "authenticated business user <span class='dim'>· secure chat</span>"],
      ["evidence", "<span class='warn'>1 finding</span> · batch “Processed” doesn't prove row SUP-17 was paid"],
      ["extract", "1 ask · 1 unknown <span class='dim'>(row SUP-17 status)</span>"],
      ["decide", "tool_call payment_journal.row_status <span class='dim'>(row=SUP-17)</span>"],
      ["verify", "<span class='ok'>✓</span> read · autonomous"],
      ["execute", "payment_journal → <span class='warn'>no live result · request logged, pending</span>"],
      ["decide", "reply · secure chat"],

      ["write", "ANSWERS/2/ <span class='dim'>ANSWER.md REASONING.md trace.log run.json</span>"],

  },
  {
    id: "info", label: "NEEDS INFO", glyph: "?", color: C.info,
    title: "Cancel the payment to Lantern Studio Supplies",
    headline: "Two payments match. <em>Which one</em> should we cancel?",

    term: [

      ["What we received", "<p><code>index.md</code>, <code>history.md</code>, <code>batch-044.csv</code> · 4 events · identity: authenticated business user (secure chat)</p>"],
      ["Actions", "<ul><li>Cancel a payment — <b>not done</b>, waiting for the customer to choose.</li></ul>"],
      ["Customer reply", "<p class='meta'>Secure chat</p><p class='quote'>Your batch has two pending payments to Lantern Studio Supplies: row SUP-17, due 14 October, and row SUP-21, due 21 October, both £1,240.00. Which one should we cancel? We'll act as soon as you reply.</p>"],

  {

const META = [
  { n: 1, short: "Row SUP-17 in a processed batch", who: "Leona Voss · Alderwick Studio", channel: "Secure chat", identity: "Authenticated business user", exception: "—", time: "6.4s" },
  { n: 2, short: "Row SUP-17 status, journal offline", who: "Leona Voss · Alderwick Studio", channel: "Secure chat", identity: "Authenticated business user", exception: "—", time: "5.1s" },
  { n: 3, short: "Cancel one of two payments to Lantern", who: "Leona Voss · Alderwick Studio", channel: "Secure chat", identity: "Authenticated business user", exception: "Ambiguous reference", time: "4.0s" },
  { n: 4, short: "Resend SUP-17 to new bank details", who: "Unknown sender", channel: "External message", identity: "Unverified", exception: "Hidden instructions · missing authority", time: "7.8s" },
  { n: 5, short: "Customer closes the thread", who: "Leona Voss · Alderwick Studio", channel: "Secure chat", identity: "Authenticated business user", exception: "—", time: "3.2s" },
  { n: 6, short: "Batch query, model timeout", who: "Leona Voss · Alderwick Studio", channel: "Secure chat", identity: "Authenticated business user", exception: "Read failure (model API)", time: "121.4s" },
];

const $ = (s) => document.querySelector(s);
const section = (c, name) => (c.answer.find(([h]) => h === name) || [])[1] || "";
const text = (html) => { const d = document.createElement("div"); d.innerHTML = html; d.querySelectorAll(".pill").forEach((p) => p.remove()); return d.textContent.trim(); };
const tag = (id) => `<span class="tag" style="--c:${C[id]}"><b>${ICON[id]}</b>${LABEL[id]}</span>`;
let filter = "all";
let fileTab = "answer";
let open = 0;

function renderOverview() {
  const human = CASES.filter((c) => c.handover).length;
  $("#stats").innerHTML = [
    ["Cases", CASES.length],
    ["Handled by the agent", CASES.length - human],
    ["Handed to a person", human],
    ["Blank answers", 0],
  ].map(([l, v]) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  const counts = Object.fromEntries(Object.keys(LABEL).map((k) => [k, CASES.filter((c) => c.id === k).length]));
  $("#filters").innerHTML =
    `<button class="filter" data-f="all" aria-pressed="${filter === "all"}">All <span class="count">${CASES.length}</span></button>` +
    Object.keys(LABEL).map((k) =>
      `<button class="filter" data-f="${k}" aria-pressed="${filter === k}"><span style="color:${C[k]}">${ICON[k]}</span>${LABEL[k]} <span class="count">${counts[k]}</span></button>`).join("");
  const rows = CASES.map((c, i) => ({ c, m: META[i] })).filter(({ c }) => filter === "all" || c.id === filter);
  $("#table").innerHTML =
    `<div class="row head"><span>Case</span><span>Request</span><span>Requester</span><span>Channel</span><span>Exception</span><span style="text-align:right">Time</span></div>` +
    (rows.length ? rows.map(({ c, m }) =>
      `<div class="row case" data-n="${m.n}" tabindex="0">
        <span class="n">${m.n}</span>
        <span class="t"><span>${m.short}</span>${tag(c.id)}</span>
        <span class="m">${m.who}</span><span class="m">${m.channel}</span><span class="m">${m.exception}</span>
        <span class="time">${m.time}</span>
      </div>`).join("") : `<div class="empty-row">No cases ended in this state.</div>`);
}

function logLines(c, only) {
  return c.term.filter(([lab]) => !only || lab === only).map(([lab, t]) => {
    const cls = t.includes("class='fail'") ? "is-fail" : t.includes("class='bad'") ? "is-bad" : t.includes("class='warn'") ? "is-warn" : "";
    return `<span class="l ${cls}"><span class="lab">${lab}</span>${t}</span>`;
  }).join("");
}

function timeline(c, m) {
  const items = [];
  if (c.handover) {
    const h = Object.fromEntries(c.handover);
    items.push(`<li><span class="ic" style="--c:${C[c.id]}">!</span><div class="pinned" style="--c:${C[c.id]}">
      <div class="label"><span>Pinned · needs a person</span><span>${h["Take it"]} · ${h["Urgency"]}</span></div>
      <div class="q">${h["Question for you"]}</div>
      <dl>${c.handover.filter(([k]) => !["Take it", "Urgency", "Question for you"].includes(k)).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      <div class="actions"><button class="btn primary">Take case</button><button class="btn">Reply to customer</button></div>
    </div></li>`);
  }
  const reply = section(c, "Customer reply");
  if (reply.includes("quote")) {
    const d = document.createElement("div"); d.innerHTML = reply;
    const channel = d.querySelector(".meta").textContent, words = d.querySelector(".quote").textContent;
    items.push(`<li><span class="ic">↩</span><div><div class="what">Reply drafted</div><div class="when">${channel}</div><div class="quote">${words}</div></div></li>`);
  }
  items.push(`<li><span class="ic" style="--c:${C[c.id]}">${ICON[c.id]}</span><div><div class="what">${LABEL[c.id]}</div><div class="when">${text(section(c, "Decision"))}</div></div></li>`);
  items.push(`<li><span class="ic">↓</span><div><div class="what">Case received</div><div class="when">${c.stages[0][1]} · ${m.channel} · ${m.identity}</div></div></li>`);
  return `<ol class="tl">${items.join("")}</ol>`;
}

function steps(c) {
  return `<div class="steps">` + STAGES.map((name, j) => {
    const [tone, v] = c.stages[j];
    const lines = logLines(c, name);
    return `<details><summary><span class="chev">▸</span><span class="name">${name}</span><span class="val">${v}</span><span class="st" style="--s:${TONE[tone]}">${TONE_ICON[tone]}</span></summary>
      <div class="log">${lines || `<span class="l"><span class="dim">skipped</span></span>`}</div></details>`;
  }).join("") + `<details><summary><span class="chev">▸</span><span class="name">run log</span><span class="val" style="color:var(--text-3)">full output</span><span></span></summary>
      <div class="log"><span class="l">$ uv run agent run --case ${META[open - 1].n}</span>${logLines(c)}<span class="out">${c.out}</span></div></details></div>`;
}

function renderDetail(n) {
  const c = CASES[n - 1], m = META[n - 1];
  $("#detail").innerHTML = `
    <div class="d-head">
      <div>
        <div class="eyebrow">Case ${m.n}</div>
        <h1>${m.short} ${tag(c.id)}</h1>
        <p class="decision">${text(section(c, "Decision"))}</p>
      </div>
      <div class="actions"><button class="btn" data-home>← All cases</button><button class="btn">Open ANSWERS/${m.n}/</button></div>
    </div>
    <div class="grid">
      <div>
        <div class="sec"><h2>Timeline</h2>${timeline(c, m)}</div>
        <div class="sec"><h2>What the agent did <span>${m.time}</span></h2>${steps(c)}</div>
        <div class="sec"><h2>Not done, and why</h2>${section(c, "Not done").replace("<ul>", "<ul class='plain'>") || "<p>Nothing left undone.</p>"}</div>
        <div class="sec">
          <div class="tabs">
            <button data-t="answer" aria-pressed="${fileTab === "answer"}">ANSWER.md</button>
            <button data-t="reasoning" aria-pressed="${fileTab === "reasoning"}">REASONING.md</button>
          </div>
          <div class="doc" id="doc"></div>
        </div>
      </div>
      <aside class="side">
        <section><h3>Details</h3><dl>
          <dt>Requester</dt><dd>${m.who}</dd>
          <dt>Channel</dt><dd>${m.channel}</dd>
          <dt>Identity</dt><dd>${m.identity}</dd>
          <dt>Exception</dt><dd>${m.exception}</dd>
          <dt>Duration</dt><dd>${m.time}</dd>
          <dt>Output</dt><dd><code>ANSWERS/${m.n}/</code></dd>
        </dl></section>
        <section><h3>Evidence used</h3>${section(c, "Evidence used").replace("<ul>", "<ul class='plain'>")}</section>
        <section><h3>What failed</h3>${section(c, "What failed")}</section>
      </aside>
    </div>`;
  renderDoc();
}

function renderDoc() {
  const c = CASES[open - 1], m = META[open - 1];
  const isAnswer = fileTab === "answer";
  const parts = (isAnswer ? c.answer : c.reasoning).filter(([h]) => h !== "Handover");
  $("#doc").innerHTML = parts.map(([h, b]) => `<h3>${h}</h3>${b.replace(/<span class='pill'[^>]*>[^<]*<\/span>\s*/, "")}`).join("") +
    (isAnswer && c.handover ? `<h3>Handover</h3><p>Pinned at the top of the timeline.</p>` : "");
}

function go(n) {
  open = n;
  try { history.replaceState(null, "", n ? `#case-${n}` : location.pathname); } catch (e) { /* data: and sandboxed pages have no URL to update */ }
  route();
}
function route() {
  const inDetail = open >= 1 && open <= CASES.length;
  $("#overview").hidden = inDetail;
  $("#detail").hidden = !inDetail;
  $("#crumb").innerHTML = inDetail ? `/ <a href="#" data-home>Cases</a> / ${open}` : "/ Cases";
  if (inDetail) renderDetail(open); else renderOverview();
  window.scrollTo(0, 0);
}

document.addEventListener("click", (e) => {
  if (e.target.closest("[data-home]")) { e.preventDefault(); go(0); return; }
  const f = e.target.closest(".filter");
  if (f) { filter = f.dataset.f; renderOverview(); return; }
  const r = e.target.closest(".row.case");
  if (r) { go(Number(r.dataset.n)); return; }
  const t = e.target.closest(".tabs button");
  if (t) {
    fileTab = t.dataset.t;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === fileTab)));
    renderDoc();
  }
});
document.addEventListener("keydown", (e) => {
  const r = e.target.closest && e.target.closest(".row.case");
  if (r && e.key === "Enter") go(Number(r.dataset.n));
  if (e.key === "Escape") go(0);
});
open = Number((location.hash.match(/case-(\d+)/) || [])[1]) || 0;
route();
</script>
