<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale — Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg: #0F0E1D;
  --surface: #16152A;
  --raise: #1D1C36;
  --line: #2A2946;
  --line-soft: #1F1E37;
  --text: #ECEBF6;
  --text-2: #A7A5C2;
  --text-3: #6F6D90;
  --log-bg: #0A0917;
  --log-text: #CFCDE4;
  --on-text: #0F0E1D;
  --done: #42C08A;
  --requested: #E6A847;
  --info: #7D95FF;
  --escalated: #F2735F;
  --noop: #9593AE;
  --failure: #D77BC0;
  --skip: #3F3D5E;
  --sans: "Geist", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #EFEEF5;
  --surface: #F7F6FB;
  --raise: #E7E5F0;
  --line: #D9D7E6;
  --line-soft: #E3E1EC;
  --text: #191830;
  --text-2: #55536F;
  --text-3: #8B89A6;
  --log-bg: #E8E6F1;
  --log-text: #2C2A45;
  --on-text: #F7F6FB;
  --done: #17845A;
  --requested: #A86A10;
  --info: #3B5BE0;
  --escalated: #C9402B;
  --noop: #6E6C86;
  --failure: #9B2F7C;
  --skip: #C4C2D4;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 72px; }
code { font: 12.5px var(--mono); background: var(--raise); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; }

/* app bar */
.bar { border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 12px; height: 52px; padding-bottom: 0; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--text); color: var(--on-text); display: grid; place-items: center; font: 600 10px var(--mono); }
.bar b { font-weight: 600; }
.crumb { color: var(--text-3); }
.crumb a { color: var(--text-2); text-decoration: none; }
.crumb a:hover { color: var(--text); }
.sample { margin-left: auto; font: 12px var(--mono); color: var(--text-3); }
.theme { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.theme button { all: unset; cursor: pointer; padding: 3px 10px; border-radius: 5px; font-size: 12.5px; color: var(--text-3); }
.theme button[aria-pressed="true"] { background: var(--raise); color: var(--text); }

/* status tag (Stripe) */
.tag { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 5px; font: 500 12px/1.6 var(--sans); color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; vertical-align: middle; }
.tag b { font: 500 11px var(--mono); }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--text); color: var(--on-text); border-color: var(--text); }

/* overview (Mercury) */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 30px 0 22px; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font: 600 24px/1.2 var(--sans); letter-spacing: -0.015em; }
.page-head p { color: var(--text-3); margin-top: 4px; font-size: 13px; }
.stats { display: flex; gap: 36px; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.stat .l { font-size: 12.5px; color: var(--text-3); }
.stat .v { font: 500 22px/1.3 var(--sans); letter-spacing: -0.01em; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 16px 0 10px; }
.filter { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--text-2); cursor: pointer; font-size: 13px; }
.filter:hover { color: var(--text); }
.filter[aria-pressed="true"] { color: var(--text); background: var(--raise); border-color: var(--text-3); }
.filter .count { font: 12px var(--mono); color: var(--text-3); }
.row { display: grid; grid-template-columns: 52px minmax(0, 2.6fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.4fr) 70px; gap: 14px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--line-soft); }
.row.head { font-size: 12.5px; color: var(--text-3); padding-top: 8px; padding-bottom: 8px; border-bottom-color: var(--line); }
.row.case { cursor: pointer; }
.row.case:hover { background: var(--surface); }
.row .n { font: 13px var(--mono); color: var(--text-3); }
.row .t { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .t span:first-child { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .time { font: 12.5px var(--mono); color: var(--text-3); text-align: right; }
.empty-row { padding: 28px 4px; color: var(--text-3); }

/* detail (Stripe) */
.d-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 28px 0 26px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.eyebrow { font: 500 11.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
.d-head h1 { font: 600 26px/1.25 var(--sans); letter-spacing: -0.02em; margin: 6px 0 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.d-head .decision { color: var(--text-2); max-width: 680px; }
.actions { display: flex; gap: 8px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 48px; align-items: start; padding-top: 26px; }
.sec { margin-bottom: 34px; }
.sec > h2 { font: 600 15px var(--sans); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; }
.sec > h2 span { font: 12.5px var(--mono); color: var(--text-3); font-weight: 400; }

/* timeline */
.tl { list-style: none; padding: 0; }
.tl > li { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding-bottom: 18px; position: relative; }
.tl > li::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: 2px; width: 1px; background: var(--line); }
.tl > li:last-child::before { display: none; }
.tl .ic { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; font: 11px var(--mono); color: var(--c, var(--text-3)); background: var(--raise); border: 1px solid var(--line); }
.tl .what { font-weight: 500; }
.tl .when { font-size: 12.5px; color: var(--text-3); }
.tl .quote { margin-top: 6px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font-size: 14px; }
.pinned { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 7%, var(--surface)); border-radius: 10px; padding: 14px 16px; }
.pinned .label { font: 500 12px var(--sans); color: var(--c); display: flex; justify-content: space-between; gap: 10px; }
.pinned .q { font-size: 15px; font-weight: 500; margin: 6px 0 12px; }
.pinned dl { display: grid; grid-template-columns: 120px 1fr; gap: 6px 14px; font-size: 13.5px; }
.pinned dt { color: var(--text-3); }
.pinned .actions { margin-top: 14px; }

/* steps (Vercel) */
.steps { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.steps details { border-top: 1px solid var(--line); }
.steps details:first-child { border-top: 0; }
.steps summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 14px 92px minmax(0, 1fr) 18px; gap: 10px; align-items: center; padding: 10px 14px; }
.steps summary::-webkit-details-marker { display: none; }
.steps summary:hover { background: var(--surface); }
.steps summary .chev { color: var(--text-3); font-size: 11px; transition: transform 0.15s; }
.steps details[open] summary .chev { transform: rotate(90deg); }
.steps summary .name { font: 13px var(--mono); color: var(--text-2); }
.steps summary .val { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps summary .st { font: 12px var(--mono); color: var(--s); text-align: right; }
.log { background: var(--log-bg); border-top: 1px solid var(--line); font: 12.5px/1.75 var(--mono); padding: 8px 0; color: var(--log-text); }
.log .l { display: block; padding: 0 14px; white-space: pre-wrap; word-break: break-word; }
.log .l .lab { color: var(--text-3); display: inline-block; width: 10ch; }
.log .l.is-warn { background: color-mix(in srgb, var(--requested) 12%, transparent); }
.log .l.is-bad { background: color-mix(in srgb, var(--escalated) 14%, transparent); }
.log .l.is-fail { background: color-mix(in srgb, var(--failure) 14%, transparent); }
.log .ok { color: var(--done); } .log .warn { color: var(--requested); } .log .bad { color: var(--escalated); } .log .fail { color: var(--failure); } .log .dim { color: var(--text-3); }
.log .out { display: block; padding: 8px 14px 2px; margin-top: 6px; border-top: 1px dashed var(--line); color: var(--text); }

ul.plain { list-style: none; padding: 0; }
ul.plain li { padding: 9px 0; border-top: 1px solid var(--line-soft); }
ul.plain li:first-child { border-top: 0; padding-top: 0; }

/* files */
.tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tabs button { all: unset; cursor: pointer; padding: 8px 0; margin-bottom: -1px; font: 13px var(--mono); color: var(--text-3); border-bottom: 1px solid transparent; }
.tabs button[aria-pressed="true"] { color: var(--text); border-color: var(--text); }
.doc h3 { font: 500 11.5px var(--mono); color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin: 20px 0 6px; }
.doc h3:first-child { margin-top: 0; }
.doc ul { padding-left: 18px; color: var(--text-2); }
.doc p { color: var(--text-2); }
.doc li { margin: 3px 0; }
.doc b { color: var(--text); font-weight: 500; }
.doc .quote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--text); }
.doc .meta { font-size: 12px; color: var(--text-3); }

/* side (Stripe details, no boxes) */
.side h3 { font: 600 13px var(--sans); padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.side section { margin-bottom: 30px; }
.side dt { font-size: 12.5px; color: var(--text-3); }
.side dd { margin: 1px 0 12px; }
.side ul.plain li { font-size: 13.5px; color: var(--text-2); }
.side p { color: var(--text-2); font-size: 13.5px; }

/* home panels */
.panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-top: 22px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.panel.wide { grid-column: 1 / -1; }
.panel > h2 { font: 600 13.5px var(--sans); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.panel > h2 span { font: 12px var(--mono); font-weight: 400; color: var(--text-3); }
.handoffs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.handoff { border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: color-mix(in srgb, var(--c) 6%, var(--surface)); border-radius: 9px; padding: 13px 14px; }
.handoff .top { display: flex; flex-direction: column; gap: 2px; font: 12px var(--mono); color: var(--text-3); }
.handoff .top .who { font: 500 12.5px var(--sans); color: var(--c); }
.handoff .q { font-weight: 500; margin: 8px 0 12px; line-height: 1.4; }
.handoff .actions { display: flex; gap: 8px; }
.trio { display: flex; gap: 22px; margin-bottom: 12px; }
.trio .v { font: 500 24px/1.2 var(--sans); letter-spacing: -0.01em; }
.trio .l { font-size: 12px; color: var(--text-3); }
.reasons { list-style: none; padding: 0; }
.reasons li { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--text-2); }
.reasons li b { font-family: var(--mono); font-weight: 400; color: var(--escalated); }
.flags li { display: grid; grid-template-columns: 120px 1fr 22px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line-soft); font-size: 13px; }
.flags li:first-child, .reasons li:first-child { border-top: 0; }
.flags .bar { height: 6px; border-radius: 3px; background: var(--raise); overflow: hidden; }
.flags .bar i { display: block; height: 100%; background: var(--requested); border-radius: 3px; }
.flags .n { font: 12px var(--mono); color: var(--text-2); text-align: right; }
.score { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
.score .v { font: 500 24px/1.2 var(--sans); letter-spacing: -0.01em; }
.score .l { font-size: 12px; color: var(--text-3); }
.panel .foot { margin-top: 12px; font: 11.5px var(--mono); color: var(--text-3); }
.real-tag { font: 11px var(--mono); color: var(--done); }
@media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }

/* case view switch */
.views { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-top: 18px; }
.views button { all: unset; cursor: pointer; padding: 10px 0; margin-bottom: -1px; font-size: 14px; color: var(--text-3); border-bottom: 2px solid transparent; }
.views button[aria-pressed="true"] { color: var(--text); border-color: var(--text); }
.d-head { border-bottom: 0; padding-bottom: 0; }

/* thinking */
.think-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 22px 0 18px; }
.think-head p { color: var(--text-2); max-width: 640px; }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text-3); margin-top: 6px; }
.who { display: inline-flex; align-items: center; padding: 0 7px; border-radius: 5px; font: 500 11px/1.8 var(--mono); letter-spacing: 0.04em; }
.who.ai { color: var(--info); background: color-mix(in srgb, var(--info) 14%, transparent); }
.who.code { color: var(--text-2); background: var(--raise); }
.real { font: 12px var(--mono); color: var(--done); }
.thoughts { list-style: none; padding: 0; max-width: 820px; }
.thought { display: grid; grid-template-columns: 26px 1fr; gap: 14px; padding-bottom: 20px; position: relative; }
.thought::before { content: ""; position: absolute; left: 12px; top: 28px; bottom: 4px; width: 1px; background: var(--line); }
.thought:last-child::before { display: none; }
.thought .dot { width: 25px; height: 25px; border-radius: 50%; display: grid; place-items: center; font: 12px var(--mono); background: var(--raise); border: 1px solid var(--line); color: var(--text-2); }
.thought.ai .dot { color: var(--info); border-color: color-mix(in srgb, var(--info) 45%, var(--line)); }
.thought.bad .dot { color: var(--escalated); border-color: color-mix(in srgb, var(--escalated) 45%, var(--line)); }
.thought .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 13px 15px; }
.thought.bad .card { border-color: color-mix(in srgb, var(--escalated) 45%, var(--line)); }
.thought .top { display: flex; align-items: center; gap: 10px; }
.thought .top b { font-weight: 600; }
.thought .top .t { margin-left: auto; font: 12px var(--mono); color: var(--text-3); }
.thought .body { margin-top: 10px; display: grid; gap: 10px; font-size: 13.5px; }
.thought .k { font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin-bottom: 3px; }
.msg { border-left: 2px solid var(--line); padding-left: 10px; }
.msg .meta { font: 12px var(--mono); color: var(--text-3); }
.chip { display: inline-block; font: 11.5px var(--mono); color: var(--text-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.claim { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.claim .kind { font: 11.5px var(--mono); color: var(--requested); }
.claim .kind.fact { color: var(--done); }
.why { list-style: none; padding: 0; display: grid; gap: 6px; }
.why li { padding-left: 14px; position: relative; color: var(--text); }
.why li::before { content: "›"; position: absolute; left: 0; color: var(--info); }
.flag { color: var(--requested); }
.action { font-weight: 500; }
.verdict.ok { color: var(--done); } .verdict.no { color: var(--escalated); }
.thought.hidden-step { display: none; }
.thought.reveal { animation: rise 0.35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .thought.reveal { animation: none; } }

[hidden] { display: none !important; }
@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; gap: 8px; }
  .row { grid-template-columns: 36px minmax(0, 1fr) 64px; }
  .row > :nth-child(3), .row > :nth-child(4), .row > :nth-child(5) { display: none; }
  .stats { gap: 22px; flex-wrap: wrap; }
}
@media (max-width: 520px) {
  .wrap { padding: 0 16px 56px; }
  .pinned dl { grid-template-columns: 1fr; gap: 0 0; }
  .pinned dd { margin-bottom: 8px; }
  .steps summary { grid-template-columns: 14px 1fr 18px; }
  .steps summary .val { display: none; }
}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <div class="logo">S</div>
    <b>Scale</b>
    <span class="crumb" id="crumb"></span>
    <span class="sample">mockup · sample data, not real results</span>
    <div class="theme" role="group" aria-label="Theme"><button data-theme-set="dark" aria-pressed="true">Dark</button><button data-theme-set="light" aria-pressed="false">Light</button></div>
  </div>
</header>

<main class="wrap">
  <section id="overview">
    <div class="page-head">
      <div>
        <h1>Cases</h1>
        <p>Reality Test run · finished in 2m 28s</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="panels" id="panels"></div>
    <div class="filters" id="filters"></div>
    <div id="table"></div>
  </section>

  <section id="detail" hidden></section>
</main>

<script>
const C = { done: "var(--done)", requested: "var(--requested)", info: "var(--info)", escalated: "var(--escalated)", noop: "var(--noop)", failure: "var(--failure)" };
const ICON = { done: "✓", requested: "◐", info: "?", escalated: "▲", noop: "○", failure: "■" };
const STAGES = ["ingest", "identity", "evidence", "extract", "decide", "verify", "execute", "write"];
const TONE = { ok: C.done, warn: C.requested, bad: C.escalated, fail: C.failure, skip: "var(--skip)", info: C.info };
const TONE_ICON = { ok: "✓", warn: "!", bad: "✗", fail: "✗", skip: "–", info: "?" };
const RECEIVED = "<p><code>index.md</code>, <code>history.md</code> · 0 attachments · 5 events · cut at <code>event-002</code> · identity: authenticated business user (secure chat)</p>";
const LABEL = { done: "Done", requested: "Requested", info: "Needs info", escalated: "Escalated", noop: "No action", failure: "System failure" };
const CASES = [
  {
    id: "done", label: "DONE", glyph: "●", color: C.done,
    title: "One line in the supplier batch",
    headline: "Batch says processed. Row SUP-17 was <em>rejected</em>.",
    stages: [["ok","5 events"],["ok","authenticated"],["warn","1 finding"],["ok","1 ask"],["ok","read"],["ok","approved"],["ok","1 read"],["ok","4 files"]],
    term: [
      ["ingest", "5 events · 0 attachments · cut at event-002"],
      ["identity", "authenticated business user <span class='dim'>· secure chat</span>"],
      ["evidence", "<span class='warn'>1 finding</span> · batch “Processed” doesn't prove row SUP-17 was paid"],
      ["extract", "1 ask · 1 unknown <span class='dim'>(row SUP-17 status)</span>"],
      ["decide", "tool_call payment_journal.row_status <span class='dim'>(batch=Alderwick supplier payments, row=SUP-17)</span>"],
      ["verify", "<span class='ok'>✓</span> read · autonomous"],
      ["execute", "payment_journal → SUP-17 <span class='bad'>REJECTED</span> <span class='dim'>· beneficiary details mismatch</span>"],
      ["decide", "reply · secure chat"],
      ["verify", "<span class='ok'>✓</span> claim-linter · <span class='ok'>✓</span> ask-1 closed · <span class='ok'>✓</span> finding-1 addressed"],
      ["write", "ANSWERS/1/ <span class='dim'>ANSWER.md REASONING.md trace.log run.json</span>"],
    ],
    out: "● DONE  1 action · 0 escalations · 6.4s",
    answer: [
      ["Decision", "<p><span class='pill' style='--pc:#1F9D6B'>DONE</span> Checked row SUP-17 in the payment journal; it is shown as rejected.</p>"],

    { who: "code", kind: "trust", title: "Worked out who is asking", time: "0.0s", lines: ["External message → unverified"], bad: true },
    { who: "code", kind: "flag", title: "Checked the evidence", time: "0.0s", flags: [["identity", "New beneficiary account doesn’t match the record for SUP-17.", "event-002"], ["hidden instruction", "“Skip the usual checks” inside a customer message.", "event-003"]] },
    { who: "ai", kind: "decide", title: "Proposed the next step", time: "4.8s", action: "Resubmit SUP-17 with the new details", why: ["The customer asks for the payment to be resent."] },
    { who: "code", kind: "check", title: "Safety check", time: "0.0s", ok: false, lines: ["✗ authority: moving money needs a verified identity", "✗ findings: 2 not addressed"] },
    { who: "ai", kind: "decide", title: "Reconsidered after the rejection", time: "2.9s", action: "Escalate to Business Payments, fraud review", why: ["The sender isn’t verified and the bank details differ from our record.", "An instruction to skip checks inside a message isn’t policy: it’s a warning sign.", "Asking on the same unverified channel proves nothing."] },
    { who: "code", kind: "check", title: "Safety check", time: "0.0s", ok: true, lines: ["Handover note complete ✓", "Holding reply claims nothing ✓"] },
  ]},
  { steps: [
    { who: "code", kind: "read", title: "Read the case", time: "0.1s", events: [["event-006", "Secure chat", "Leona Voss", "Thanks — I can see SUP-17 was rejected, we’ll fix the supplier details ourselves."]] },
    { who: "ai", kind: "understand", title: "Understood the request", time: "3.0s", asks: [], unknowns: [], claims: [["Leona Voss", "will correct the supplier details herself", "event-006", "her claim"]], mood: "Calm" },
    { who: "ai", kind: "decide", title: "Proposed the next step", time: "0.1s", action: "Do nothing", why: ["Nothing is being asked. A follow-up would add noise to a closed thread."] },
    { who: "code", kind: "check", title: "Safety check", time: "0.0s", ok: true, lines: ["No open asks left ✓"] },
  ]},
  { steps: [
    { who: "code", kind: "read", title: "Read the case", time: "0.1s", events: EV044 },
    { who: "code", kind: "flag", title: "Checked the evidence", time: "0.0s", flags: [["status", "A whole-batch status is given while one line’s status is unclear.", "event-001, event-002"]] },
    { who: "ai", kind: "understand", title: "Understood the request", time: "8.1s", asks: ["Check row SUP-17’s status."], unknowns: ["Row SUP-17’s status"], claims: [], mood: "Calm" },
    { who: "ai", kind: "decide", title: "Tried to decide", time: "120.0s", failed: "The model API timed out after 60 s, twice." },
    { who: "code", kind: "check", title: "Fell back safely", time: "0.0s", ok: false, lines: ["Wrote an escalated answer with everything received", "Nothing was changed; no status was claimed"] },
  ]},
];

const $ = (s) => document.querySelector(s);
const section = (c, name) => (c.answer.find(([h]) => h === name) || [])[1] || "";
const text = (html) => { const d = document.createElement("div"); d.innerHTML = html; d.querySelectorAll(".pill").forEach((p) => p.remove()); return d.textContent.trim(); };
const tag = (id) => `<span class="tag" style="--c:${C[id]}"><b>${ICON[id]}</b>${LABEL[id]}</span>`;
let filter = "all";
let fileTab = "answer";
let open = 0;
let view = "summary";
let replayTimer = null;

const plain = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent.trim(); };

// Real numbers: README.md "Results", eval round 5 on the 50 practice cases.
const SCORE = [["98%", "action match"], ["0%", "clean-case escalation"], ["9/10", "judgement cases passed"], ["0", "system-failure fallbacks"]];

function renderPanels() {
  const handoffs = CASES.map((c, i) => ({ c, m: META[i] })).filter(({ c }) => c.handover);
  const needs = `<div class="panel wide"><h2>Needs a person <span>${handoffs.length} waiting</span></h2><div class="handoffs">` +
    handoffs.map(({ c, m }) => {
      const h = Object.fromEntries(c.handover);
      return `<div class="handoff" style="--c:${C[c.id]}">
        <div class="top"><span class="who">${h["Take it"]} · ${h["Urgency"]}</span>Case ${m.n} · ${m.short}</div>
        <div class="q">${h["Question for you"]}</div>
        <div class="actions"><button class="btn primary">Take case</button><button class="btn" data-open="${m.n}">Open case</button></div>
      </div>`;
    }).join("") + `</div></div>`;

  const verify = CASES.flatMap((c) => c.term.filter(([lab]) => lab === "verify").map(([, t]) => t));
  const blocked = verify.filter((t) => t.includes("class='bad'"));
  const approved = verify.length - blocked.length;
  const reconsidered = CASES.filter((c) => {
    const v = c.term.filter(([lab]) => lab === "verify").map(([, t]) => t.includes("class='bad'"));
    return v.includes(true) && v[v.length - 1] === false;
  }).length;
  const reasons = blocked.flatMap((t) => plain(t).split("·")).map((x) => x.replace("✗", "").trim()).filter(Boolean);
  const safety = `<div class="panel"><h2>Safety checks <span>before anything runs</span></h2>
    <div class="trio"><div><div class="v">${approved}</div><div class="l">approved</div></div>
    <div><div class="v" style="color:var(--escalated)">${blocked.length}</div><div class="l">blocked</div></div>
    <div><div class="v">${reconsidered}</div><div class="l">reconsidered after a block</div></div></div>
    <ul class="reasons">${reasons.map((r) => `<li><b>✗</b>${r}</li>`).join("")}</ul></div>`;

  const counts = {};
  THINK.forEach((t) => t.steps.forEach((st) => (st.flags || []).forEach(([k]) => { counts[k] = (counts[k] || 0) + 1; })));
  const max = Math.max(1, ...Object.values(counts));
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const flags = `<div class="panel"><h2>Evidence flags <span>before the AI reads</span></h2>
    <ul class="reasons flags">${Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) =>
      `<li><span>${k}</span><span class="bar"><i style="width:${(n / max) * 100}%"></i></span><span class="n">${n}</span></li>`).join("")}</ul>
    <div class="foot">${total} flags across ${CASES.length} cases</div></div>`;

  const score = `<div class="panel"><h2>Practice scorecard <span class="real-tag">● real results</span></h2>
    <div class="score">${SCORE.map(([v, l]) => `<div><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>
    <div class="foot">50 practice cases · eval round 5 · claude-opus-5-5</div></div>`;

  $("#panels").innerHTML = needs + safety + flags + score;
}

function renderOverview() {
  renderPanels();
  const human = CASES.filter((c) => c.handover).length;
  $("#stats").innerHTML = [
    ["Cases", CASES.length],
    ["Handled by the agent", CASES.length - human],
    ["Handed to a person", human],
    ["Blank answers", 0],
  ].map(([l, v]) => `<div class="stat"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("");
  const counts = Object.fromEntries(Object.keys(LABEL).map((k) => [k, CASES.filter((c) => c.id === k).length]));
  $("#filters").innerHTML =
    `<button class="filter" data-f="all" aria-pressed="${filter === "all"}">All <span class="count">${CASES.length}</span></button>` +
    Object.keys(LABEL).map((k) =>
      `<button class="filter" data-f="${k}" aria-pressed="${filter === k}"><span style="color:${C[k]}">${ICON[k]}</span>${LABEL[k]} <span class="count">${counts[k]}</span></button>`).join("");
  const rows = CASES.map((c, i) => ({ c, m: META[i] })).filter(({ c }) => filter === "all" || c.id === filter);
  $("#table").innerHTML =
    `<div class="row head"><span>Case</span><span>Request</span><span>Requester</span><span>Channel</span><span>Exception</span><span style="text-align:right">Time</span></div>` +
    (rows.length ? rows.map(({ c, m }) =>
      `<div class="row case" data-n="${m.n}" tabindex="0">
        <span class="n">${m.n}</span>
        <span class="t"><span>${m.short}</span>${tag(c.id)}</span>
        <span class="m">${m.who}</span><span class="m">${m.channel}</span><span class="m">${m.exception}</span>
        <span class="time">${m.time}</span>
      </div>`).join("") : `<div class="empty-row">No cases ended in this state.</div>`);
}

function logLines(c, only) {
  return c.term.filter(([lab]) => !only || lab === only).map(([lab, t]) => {
    const cls = t.includes("class='fail'") ? "is-fail" : t.includes("class='bad'") ? "is-bad" : t.includes("class='warn'") ? "is-warn" : "";
    return `<span class="l ${cls}"><span class="lab">${lab}</span>${t}</span>`;
  }).join("");
}

function timeline(c, m) {
  const items = [];
  if (c.handover) {
    const h = Object.fromEntries(c.handover);
    items.push(`<li><span class="ic" style="--c:${C[c.id]}">!</span><div class="pinned" style="--c:${C[c.id]}">
      <div class="label"><span>Pinned · needs a person</span><span>${h["Take it"]} · ${h["Urgency"]}</span></div>
      <div class="q">${h["Question for you"]}</div>
      <dl>${c.handover.filter(([k]) => !["Take it", "Urgency", "Question for you"].includes(k)).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
      <div class="actions"><button class="btn primary">Take case</button><button class="btn">Reply to customer</button></div>
    </div></li>`);
  }
  const reply = section(c, "Customer reply");
  if (reply.includes("quote")) {
    const d = document.createElement("div"); d.innerHTML = reply;
    const channel = d.querySelector(".meta").textContent, words = d.querySelector(".quote").textContent;
    items.push(`<li><span class="ic">↩</span><div><div class="what">Reply drafted</div><div class="when">${channel}</div><div class="quote">${words}</div></div></li>`);
  }
  items.push(`<li><span class="ic" style="--c:${C[c.id]}">${ICON[c.id]}</span><div><div class="what">${LABEL[c.id]}</div><div class="when">${text(section(c, "Decision"))}</div></div></li>`);
  items.push(`<li><span class="ic">↓</span><div><div class="what">Case received</div><div class="when">${c.stages[0][1]} · ${m.channel} · ${m.identity}</div></div></li>`);
  return `<ol class="tl">${items.join("")}</ol>`;
}

function steps(c) {
  return `<div class="steps">` + STAGES.map((name, j) => {
    const [tone, v] = c.stages[j];
    const lines = logLines(c, name);
    return `<details><summary><span class="chev">▸</span><span class="name">${name}</span><span class="val">${v}</span><span class="st" style="--s:${TONE[tone]}">${TONE_ICON[tone]}</span></summary>
      <div class="log">${lines || `<span class="l"><span class="dim">skipped</span></span>`}</div></details>`;
  }).join("") + `<details><summary><span class="chev">▸</span><span class="name">run log</span><span class="val" style="color:var(--text-3)">full output</span><span></span></summary>
      <div class="log"><span class="l">$ uv run agent run --case ${META[open - 1].n}</span>${logLines(c)}<span class="out">${c.out}</span></div></details></div>`;
}

function renderDetail(n) {
  const c = CASES[n - 1], m = META[n - 1];
  $("#detail").innerHTML = `
    <div class="d-head">
      <div>
        <div class="eyebrow">Case ${m.n}</div>
        <h1>${m.short} ${tag(c.id)}</h1>
        <p class="decision">${text(section(c, "Decision"))}</p>
      </div>
      <div class="actions"><button class="btn" data-home>← All cases</button><button class="btn">Open ANSWERS/${m.n}/</button></div>
    </div>
    <nav class="views">
      <button data-view="summary" aria-pressed="${view === "summary"}">Summary</button>
      <button data-view="thinking" aria-pressed="${view === "thinking"}">How it thought</button>
      <button data-view="files" aria-pressed="${view === "files"}">Files</button>
    </nav>
    <div id="v-thinking" ${view === "thinking" ? "" : "hidden"}>${thinking(n)}</div>
    <div id="v-files" class="sec" style="padding-top:22px" ${view === "files" ? "" : "hidden"}>
      <div class="tabs">
        <button data-t="answer" aria-pressed="${fileTab === "answer"}">ANSWER.md</button>
        <button data-t="reasoning" aria-pressed="${fileTab === "reasoning"}">REASONING.md</button>
      </div>
      <div class="doc" id="doc"></div>
    </div>
    <div class="grid" id="v-summary" ${view === "summary" ? "" : "hidden"}>
      <div>
        <div class="sec"><h2>Timeline</h2>${timeline(c, m)}</div>
        <div class="sec"><h2>What the agent did <span>${m.time}</span></h2>${steps(c)}</div>
        <div class="sec"><h2>Not done, and why</h2>${section(c, "Not done").replace("<ul>", "<ul class='plain'>") || "<p>Nothing left undone.</p>"}</div>
      </div>
      <aside class="side">
        <section><h3>Details</h3><dl>
          <dt>Requester</dt><dd>${m.who}</dd>
          <dt>Channel</dt><dd>${m.channel}</dd>
          <dt>Identity</dt><dd>${m.identity}</dd>
          <dt>Exception</dt><dd>${m.exception}</dd>
          <dt>Duration</dt><dd>${m.time}</dd>
          <dt>Output</dt><dd><code>ANSWERS/${m.n}/</code></dd>
        </dl></section>
        <section><h3>Evidence used</h3>${section(c, "Evidence used").replace("<ul>", "<ul class='plain'>")}</section>
        <section><h3>What failed</h3>${section(c, "What failed")}</section>
      </aside>
    </div>`;
  renderDoc();
}

function thought(s) {
  const bad = s.ok === false || s.bad || s.failed;
  const icon = { read: "↓", trust: "◇", flag: "!", understand: "≡", decide: "→", check: s.ok === false ? "✗" : "✓", act: "⚙" }[s.kind];
  const parts = [];
  if (s.events) parts.push(s.events.map(([id, ch, from, body]) => `<div class="msg"><div class="meta">${id} · ${ch} · ${from}</div>${body}</div>`).join(""));
  if (s.note) parts.push(`<div style="color:var(--text-3)">${s.note}</div>`);
  if (s.flags) parts.push(s.flags.map(([k, d, ev]) => `<div><span class="flag">! ${k}</span> ${d}<span class="chip">${ev}</span></div>`).join(""));
  if (s.claims && s.claims.length) parts.push(`<div><div class="k">What it found</div>${s.claims.map(([sub, v, ev, kind]) => `<div class="claim"><span>${sub}: ${v}</span><span class="kind ${kind === "fact" ? "fact" : ""}">${kind}</span><span class="chip">${ev}</span></div>`).join("")}</div>`);
  if (s.asks) parts.push(`<div><div class="k">What's being asked</div>${s.asks.length ? s.asks.map((x) => `<div>${x}</div>`).join("") : "<div>Nothing</div>"}</div>`);
  if (s.unknowns && s.unknowns.length) parts.push(`<div><div class="k">What it doesn't know yet</div><ul class="why">${s.unknowns.map((x) => `<li>${x}</li>`).join("")}</ul></div>`);
  if (s.mood) parts.push(`<div><div class="k">Customer's mood</div>${s.mood}</div>`);
  if (s.action) parts.push(`<div><div class="k">Proposal</div><div class="action">${s.action}</div></div>`);
  if (s.why) parts.push(`<div><div class="k">Why</div><ul class="why">${s.why.map((x) => `<li>${x}</li>`).join("")}</ul></div>`);
  if (s.failed) parts.push(`<div class="verdict no">✗ ${s.failed}</div>`);
  if (s.lines) parts.push(`<div class="${s.kind === "check" ? `verdict ${s.ok === false ? "no" : "ok"}` : ""}">${s.lines.map((x) => `<div>${x}</div>`).join("")}</div>`);
  return `<li class="thought ${s.who} ${bad ? "bad" : ""}"><span class="dot">${icon}</span><div class="card">
    <div class="top"><span class="who ${s.who}">${s.who === "ai" ? "AI" : "CODE"}</span><b>${s.title}</b><span class="t">${s.time}</span></div>
    <div class="body">${parts.join("")}</div></div></li>`;
}

function thinking(n) {
  const t = THINK[n - 1];
  return `<div class="think-head">
      <div><p>Every step the agent took on this case, in order. The AI reads and proposes; plain code checks and acts.</p>
      <div class="legend"><span><span class="who ai">AI</span> Claude</span><span><span class="who code">CODE</span> fixed rules</span>${t.real ? `<span class="real">● from a real run</span>` : `<span>sample data</span>`}</div></div>
      <button class="btn" data-replay>▶ Replay</button>
    </div>
    <ol class="thoughts" id="thoughts">${t.steps.map(thought).join("")}</ol>`;
}

function replay() {
  clearTimeout(replayTimer);
  const items = [...document.querySelectorAll("#thoughts .thought")];
  items.forEach((el) => { el.classList.add("hidden-step"); el.classList.remove("reveal"); });
  let i = 0;
  const next = () => {
    if (i >= items.length) return;
    items[i].classList.remove("hidden-step");
    items[i].classList.add("reveal");
    i += 1;
    replayTimer = setTimeout(next, 900);
  };
  next();
}

function setView(v) {
  view = v;
  clearTimeout(replayTimer);
  ["summary", "thinking", "files"].forEach((x) => { $(`#v-${x}`).hidden = x !== v; });
  document.querySelectorAll(".views button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
  document.querySelectorAll("#thoughts .thought").forEach((el) => el.classList.remove("hidden-step"));
}

function renderDoc() {
  const c = CASES[open - 1], m = META[open - 1];
  const isAnswer = fileTab === "answer";
  const parts = (isAnswer ? c.answer : c.reasoning).filter(([h]) => h !== "Handover");
  $("#doc").innerHTML = parts.map(([h, b]) => `<h3>${h}</h3>${b.replace(/<span class='pill'[^>]*>[^<]*<\/span>\s*/, "")}`).join("") +
    (isAnswer && c.handover ? `<h3>Handover</h3><p>Pinned at the top of the Summary timeline.</p>` : "");
}

function go(n) {
  open = n;
  try { history.replaceState(null, "", n ? `#case-${n}` : location.pathname); } catch (e) { /* data: and sandboxed pages have no URL to update */ }
  route();
}
function route() {
  const inDetail = open >= 1 && open <= CASES.length;
  $("#overview").hidden = inDetail;
  $("#detail").hidden = !inDetail;
  $("#crumb").innerHTML = inDetail ? `/ <a href="#" data-home>Cases</a> / ${open}` : "/ Cases";
  if (inDetail) renderDetail(open); else renderOverview();
  window.scrollTo(0, 0);
}

function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === t)));
  try { localStorage.setItem("theme", t); } catch (e) { /* storage blocked: theme just isn't remembered */ }
}
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) { /* storage blocked */ }
setTheme(saved === "light" ? "light" : "dark");

document.addEventListener("click", (e) => {
  const th = e.target.closest("[data-theme-set]");
  if (th) { setTheme(th.dataset.themeSet); return; }
  if (e.target.closest("[data-home]")) { e.preventDefault(); go(0); return; }
  const oc = e.target.closest("[data-open]");
  if (oc) { go(Number(oc.dataset.open)); return; }
  const f = e.target.closest(".filter");
  if (f) { filter = f.dataset.f; renderOverview(); return; }
  const r = e.target.closest(".row.case");
  if (r) { go(Number(r.dataset.n)); return; }
  const vb = e.target.closest(".views button");
  if (vb) { setView(vb.dataset.view); return; }
  if (e.target.closest("[data-replay]")) { replay(); return; }
  const t = e.target.closest(".tabs button");
  if (t) {
    fileTab = t.dataset.t;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.t === fileTab)));
    renderDoc();
  }
});
document.addEventListener("keydown", (e) => {
  const r = e.target.closest && e.target.closest(".row.case");
  if (r && e.key === "Enter") go(Number(r.dataset.n));
  if (e.key === "Escape") go(0);
});
open = Number((location.hash.match(/case-(\d+)/) || [])[1]) || 0;
route();
</script>
</body>
</html>
